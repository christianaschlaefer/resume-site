<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Your Name — Resume</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    STAGE
    Fixed-height viewport section. No longer needs position: sticky
    or a tall runway parent — the horizontal scrolling happens
    natively INSIDE #track below, not via vertical scroll translation.
  -->
  <div id="stage">

    <!-- tabindex + role/aria-label make this reachable and
         understandable by keyboard and screen-reader users — without
         these, there was no way to even discover the timeline exists
         via keyboard, since native browser scroll-focus isn't
         guaranteed across browsers for a plain div. -->
    <div id="track" tabindex="0" role="region" aria-label="Career timeline. Use arrow keys to move between entries."></div>

    <!-- aria-live announces new/upgraded skills to screen readers as
         they happen, since this content changes based on scroll
         position with no other cue a non-visual user would have. -->
    <div id="skill-archive" role="status" aria-live="polite"></div>

  </div>

  <!-- Single reusable Detail popup, living OUTSIDE #track entirely.
       Positioned with JS (position: fixed) to sit under whichever
       anchor word triggered it. Kept outside the scrolling container
       so it's never clipped by #track's overflow-x:scroll boundary. -->
  <div id="detail-popup" role="tooltip" hidden></div>

  <!-- Full-screen resume takeover. Lives OUTSIDE #track entirely (not
       inside the outro tile) specifically so it never has to interact
       with #track's flex layout or scroll-width math — see the chat
       for why an in-place position:fixed approach was rejected.
       Shown/hidden by main.js, tied to the SAME timeline:activechange
       event already used to hide the skill archive.
       role="dialog"/aria-modal marks this as a real modal for
       assistive tech — paired with making #stage `inert` while this
       is open (see main.js), so background content isn't reachable. -->
  <div id="resume-overlay" role="dialog" aria-modal="true" aria-label="Resume" hidden>
    <button id="resume-back" type="button" aria-label="Back to timeline">&larr; Back</button>
    <div id="resume-content"></div>

    <!-- Lead capture: NOT part of #resume-content on purpose, so it
         never shows up in the printed/downloaded PDF (see the print
         media query in style.css). Submission is currently mocked —
         see submitLead() in main.js — pending the real backend. -->
    <div id="lead-capture">
      <p>Want the story behind how this site was built? Leave your email and company and I'll send you a short video walkthrough.</p>
      <form id="lead-form">
        <label class="sr-only" for="lead-email">Email</label>
        <input type="email" id="lead-email" placeholder="Email" required>
        <label class="sr-only" for="lead-company">Company</label>
        <input type="text" id="lead-company" placeholder="Company" required>
        <button type="submit">Send me the video</button>
      </form>
      <p id="lead-confirmation" role="status" hidden>Thanks — check your inbox soon.</p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
