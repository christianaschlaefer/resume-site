<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>Interactive Resume</title>
  <link rel="stylesheet" href="css/style.css">
</head>
<body>

  <!--
    STAGE
    A fixed, full-viewport frame. The page itself never scrolls
    vertically — all movement happens horizontally inside #track, and
    js/timeline.js translates vertical wheel input into that sideways
    motion.
  -->
  <div id="stage">

    <div id="track-frame">
      <!-- The actual horizontally-scrolling element. Everything that
           moves through time (landing, axis, cards, points, outro) is
           rendered into #track-content by js/timeline.js. tabindex +
           role/aria-label make it reachable and understandable by
           keyboard and screen-reader users. -->
      <div id="track" tabindex="0" role="region" aria-label="Career timeline. Scroll, swipe, or use the arrow keys to move through time.">
        <div id="track-content"></div>
      </div>

      <!-- The HUD sits ABOVE the track but doesn't scroll with it: the
           playhead line, the date chip that rides on the axis, the
           progress bar, and the chapter buttons. Hidden on the landing
           and outro segments. -->
      <div id="timeline-hud">
        <div id="timeline-progress"></div>
        <button id="timeline-brand" type="button" title="Back to the start">
          <span id="timeline-brand-name"></span>
          <span class="timeline-brand-sub">Career timeline</span>
        </button>
        <div id="playhead-line" aria-hidden="true"></div>
        <div id="playhead-chip" aria-hidden="true"></div>
        <nav id="chapter-nav" aria-label="Timeline navigation">
          <button id="chapter-prev" type="button" aria-label="Previous chapter">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="M10 3 5 8l5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
          <button id="chapter-next" type="button" aria-label="Next chapter">
            <svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><path d="m6 3 5 5-5 5" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"/></svg>
          </button>
        </nav>
      </div>
    </div>

    <!-- Skill archive dock. Tokens are appended into #skill-archive as
         the playhead reaches each period, and removed when scrolling
         back. Changes are announced (summarized) via
         #timeline-announcer rather than token by token. -->
    <div id="skill-dock" class="is-hidden">
      <span class="skill-dock-label">Skills <span id="skill-count"></span></span>
      <div id="skill-archive"></div>
    </div>

  </div>

  <!-- Screen-reader announcements for chapter and skill changes —
       debounced in js/timeline.js so fast scrolling isn't chatty.
       Outside #stage so it keeps working while #stage is inert. -->
  <div id="timeline-announcer" class="sr-only" aria-live="polite"></div>

  <!-- Single reusable Detail popup, OUTSIDE #track so it's never
       clipped by the scrolling container. Positioned by main.js. -->
  <div id="detail-popup" role="tooltip" hidden></div>

  <!-- Full-screen resume takeover, OUTSIDE #track entirely. Opened and
       closed by main.js based on the timeline's zone (reaching the end
       opens it). role="dialog"/aria-modal plus making #stage `inert`
       while it's open keeps background content unreachable. -->
  <div id="resume-overlay" role="dialog" aria-modal="true" aria-label="Resume" hidden>
    <button id="resume-back" type="button" aria-label="Back to timeline">&larr; Back</button>
    <div id="resume-content"></div>

    <!-- Lead capture: NOT part of #resume-content on purpose, so it
         never shows up in the printed/downloaded PDF. Submission is
         mocked — see submitLead() in main.js — pending the backend. -->
    <div id="lead-capture">
      <p>Want the story behind how this site was built? Leave your email and company and I'll send you a short video walkthrough.</p>
      <form id="lead-form">
        <label class="sr-only" for="lead-email">Email</label>
        <input type="email" id="lead-email" placeholder="Email" required>
        <label class="sr-only" for="lead-company">Company</label>
        <input type="text" id="lead-company" placeholder="Company" required>
        <button type="submit">Send me the video</button>
      </form>
      <p id="lead-confirmation" role="status" hidden>Thanks — check your inbox soon.</p>
    </div>
  </div>

  <script src="js/data.js"></script>
  <script src="js/timeline.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
